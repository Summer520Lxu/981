<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 找不到頁面</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #1e3799; }
        
        .error-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 90%; }
        
        .bus-icon { font-size: 80px; margin-bottom: 20px; display: inline-block; animation: drive 2s infinite linear; }
        
        @keyframes drive {
            0% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            100% { transform: translateX(-5px); }
        }

        h1 { font-size: 72px; margin: 0; color: #eb2f06; }
        h2 { border-bottom: 3px solid #fa983a; display: inline-block; padding-bottom: 5px; margin-bottom: 20px; }
        
        .status-tag { background: #dcdde1; color: #7f8c8d; padding: 8px 20px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        
        p { color: #7f8c8d; line-height: 1.6; margin-bottom: 30px; }

        .btn { background: #1e3799; color: white; text-decoration: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #fa983a; }

        footer { margin-top: 50px; color: #7f8c8d; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="bus-icon">🚌</div>
        <h1>404</h1>
        <h2>網頁架構調整中</h2>
        <br>
        <div class="status-tag">此站牌暫時不停靠</div>
        
        <p>
            抱歉！您訪問的頁面可能正在施工、<br>
            或者像誤點的公車一樣消失在路徑中了。<br>
            請點擊下方按鈕回到系統首頁。
        </p>

        <a href="index.html" class="btn">返回即時動態</a>
    </div>

    <footer>
        Copyright © 2026 路線動態系統運作中
    </footer>

</body>
</html>
