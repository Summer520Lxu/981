<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>981 路線動態系統</title>
    <style>
        /* 這裡完全保留你原本的 CSS 樣式 */
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .header { background: #1e3799; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; flex: 1; }
        .column { background: white; border-radius: 10px; padding: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: fit-content; }
        h2 { border-left: 5px solid #fa983a; padding-left: 10px; color: #1e3799; }
        .stop-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .time-tag { padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 0.9em; min-width: 60px; text-align: center; }
        .coming { background: #eb2f06; color: white; }
        .minutes { background: #78e08f; color: #0a3d62; }
        .waiting { background: #dcdde1; color: #7f8c8d; }
        footer { margin-top: 40px; padding: 20px; text-align: center; color: #7f8c8d; font-size: 0.85em; border-top: 1px solid #eee; background: white; line-height: 1.8; }
        footer a { color: #1e3799; text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }
        hr { width: 60%; border: 0; border-top: 1px solid #eee; margin: 15px auto; }
        #current-time, #status { font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚌 981 即時公車動態</h1>
    <p id="current-time">現在時間：載入中...</p>
    <p id="status">請輸入密碼以啟動系統</p>
</div>

<div class="container" id="app" style="display:none;">
    <div class="column">
        <h2>往 鶯歌</h2>
        <div id="dir-0"></div>
    </div>
    <div class="column">
        <h2>往 三峽 北大社區</h2>
        <div id="dir-1"></div>
    </div>
</div>

<footer>
    <div>若您對發車時間有疑慮，建議您前往 <a href="https://ebus.gov.taipei/EBus/VsSimpleMap?routeid=0410098100&gb=0" target="_blank">大臺北公車官網</a> 查詢詳細資訊。</div>
    <hr>
    <div>網站創建日期：2026-04-02</div>
    <div>最後更新日期：2026-04-27</div>
    <div>Copyright © 2026 All Rights Reserved.</div>
</footer>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbztudyyJhebHG_qQT4ErZT9_Lt2_G6OFZeJM-BrYPjiheivy3s3Eh64YDa9XXgDF8vP/exec';
    const HIDDEN_SALT = "BusSalt_981_"; // 與後端一致
    let _u = ""; 

    function getFormattedTime() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    setInterval(() => {
        document.getElementById('current-time').innerText = `現在時間：${getFormattedTime()}`;
    }, 1000);

    async function sha256(message) {
        const msgUint8 = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function init() {
        const pwd = prompt("請輸入 981 系統存取密碼：");
        if (!pwd) return;
        _u = pwd;
        updateProcess();
    }

    async function updateProcess() {
        document.getElementById('status').innerText = "驗證更新中...";
        const timeFactor = new Date().getMinutes().toString();
        const hash = await sha256(HIDDEN_SALT + _u + timeFactor);
        await startFetch(hash);
    }

    async function startFetch(hash) {
        try {
            const response = await fetch(`${GAS_URL}?key=${hash}`);
            const data = await response.json();
            
            if (data.code === 403) {
                document.getElementById('status').innerText = "驗證失效，請重整頁面。";
                return;
            }

            document.getElementById('app').style.display = 'flex';
            document.getElementById('status').innerText = `最後更新：${getFormattedTime()}`;
            render(data, 0, 'dir-0');
            render(data, 1, 'dir-1');

            setTimeout(updateProcess, 30000);
        } catch (e) {
            document.getElementById('status').innerText = "連線失敗。";
        }
    }

    function render(allData, direction, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        const routeInfo = allData.stopOrder.find(r => r.Direction === direction);
        if (!routeInfo) return;

        routeInfo.Stops.sort((a, b) => a.StopSequence - b.StopSequence).forEach(stop => {
            const timeInfo = allData.arrival.find(t => t.StopUID === stop.StopUID && t.Direction === direction);
            let timeHtml = '<span class="time-tag waiting">未發車</span>';
            
            if (timeInfo) {
                const s = timeInfo.StopStatus;
                if (s === 0) {
                    const mins = Math.floor(timeInfo.EstimateTime / 60);
                    // 套用你的 CSS class
                    if (mins <= 1) timeHtml = '<span class="time-tag coming">進站中</span>';
                    else if (mins <= 3) timeHtml = `<span class="time-tag coming">${mins} 分</span>`;
                    else timeHtml = `<span class="time-tag minutes">${mins} 分</span>`;
                } else {
                    const statusMap = { 1: "尚未發車", 2: "交管不停", 3: "末班已過", 4: "今日停駛" };
                    timeHtml = `<span class="time-tag waiting">${statusMap[s] || "未發車"}</span>`;
                }
            }
            container.innerHTML += `<div class="stop-item"><span>${stop.StopName.Zh_tw}</span>${timeHtml}</div>`;
        });
    }

    init();
</script>
</body>
</html>
